[package]
name = "rode"
default-run = "rode"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small native Rust code editor for local and SSH workspaces"
license = "MIT"
repository = "https://github.com/pbenner/rode"
homepage = "https://pbenner.github.io/rode/"

[[bin]]
name = "rode-sessiond"
path = "src/bin/rode-sessiond.rs"

[dependencies]
rode-host-protocol = { path = "crates/rode-host-protocol" }
rode-host-core = { path = "crates/rode-host-core" }
rode-session = { path = "crates/rode-session" }
rode-agent-core = { path = "crates/rode-agent-core" }
rode-runtime-core = { path = "crates/rode-runtime-core" }
anyhow = "1"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff", "pnm", "tga"] }
libc = "0.2"
libloading = "0.8.9"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui_extras = { version = "0.33", default-features = false, features = ["syntect"] }
egui_commonmark = { version = "0.22", default-features = false, features = ["pulldown_cmark"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
latex-rust = { version = "=2.1.1", features = ["png"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.11"
sha2 = "0.10"
object = { version = "0.37", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
vt100 = "0.16"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
flate2 = "1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3"
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "sync", "macros", "signal"] }
glob = "0.3"
shell-words = "1"
hmac = "0.12"
sha1 = "0.10"
zeroize = "1"

[dev-dependencies]
rand = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

# Keep routine CI tests and the UI binary in one inexpensive build profile.
[profile.ci]
inherits = "dev"
debug = 0
incremental = false

[workspace]
members = ["crates/rode-host-protocol", "crates/rode-host-core", "crates/rode-session", "crates/rode-agent-core", "crates/rode-runtime-core", "crates/rode-bwrap", "xtask"]
default-members = ["crates/rode-host-protocol", "crates/rode-host-core", ".", "crates/rode-session", "crates/rode-agent-core", "crates/rode-runtime-core"]
