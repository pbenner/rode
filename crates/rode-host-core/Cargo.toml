[package]
name = "rode-host-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Headless host services shared by local and SSH RODE workspaces"

[dependencies]
rode-extension-api = { path = "../rode-extension-api", version = "0.1.0" }
rode-bwrap = { path = "../rode-bwrap" }
rode-runtime-core = { path = "../rode-runtime-core" }
portable-pty = "0.9"
rode-host-protocol = { path = "../rode-host-protocol" }
anyhow = "1"
base64 = "0.22"
cap-std = "=4.0.3"
dprint-plugin-typescript = "0.101"
dprint-plugin-json = "0.26"
dprint-plugin-markdown = "0.29"
markup_fmt = { version = "0.28", default-features = false }
malva = { version = "0.16", default-features = false }
pretty_yaml = { version = "0.6", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

tempfile = "3"
url = "2"
zeroize = "1"
