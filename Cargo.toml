[package]
name = "rode"
default-run = "rode"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small native Rust code editor for local and SSH workspaces"
license = "MIT"
repository = "https://github.com/pbenner/rode"
homepage = "https://pbenner.github.io/rode/"

[dependencies]
rode-session = { path = "crates/rode-session" }
anyhow = "1"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff", "pnm", "tga"] }
libc = "0.2"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui_extras = { version = "0.33", default-features = false, features = ["syntect"] }
egui_commonmark = { version = "0.22", default-features = false, features = ["pulldown_cmark"] }
pulldown-cmark = { version = "0.13", default-features = false }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.11"
sha2 = "0.10"
object = { version = "0.37", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
vt100 = "0.16"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[workspace]
members = ["crates/rode-session"]
default-members = [".", "crates/rode-session"]
