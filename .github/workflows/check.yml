name: Check
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Run all extended suites and release packaging
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
env:
  RODE_XVFB_SCREEN: '-screen 0 1600x1100x24'
  LIBGL_ALWAYS_SOFTWARE: '1'
  __GLX_VENDOR_LIBRARY_NAME: mesa
  __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      extended: ${{ steps.suites.outputs.extended }}
      run-extended: ${{ steps.suites.outputs.run-extended }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: suites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.full || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [[ "$FULL" == true ]]; then
            suites=$(python3 scripts/ci.py matrix --full)
          elif [[ -n "$BASE_SHA" ]]; then
            suites=$(python3 scripts/ci.py matrix --base "$BASE_SHA")
          else
            suites='[]'
          fi
          if [[ "$suites" == '[]' ]]; then
            echo 'run-extended=false' >> "$GITHUB_OUTPUT"
            # Keep the matrix valid even when its job is skipped.
            echo 'extended=["tools"]' >> "$GITHUB_OUTPUT"
          else
            echo 'run-extended=true' >> "$GITHUB_OUTPUT"
            echo "extended=$suites" >> "$GITHUB_OUTPUT"
          fi
          echo "Extended suites: $suites" >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-lint
      - name: Reset logs restored from the build cache
        run: rm -rf target/ci-results
      - uses: astral-sh/setup-uv@v7
      - run: python3 scripts/ci.py time dependencies -- bash scripts/ci-deps.sh lint
      - run: python3 scripts/ci.py time rust-format -- cargo fmt --all --check
      - run: python3 scripts/ci.py time python-lint -- scripts/uvx.sh ruff@0.17.3 check .
      - run: python3 scripts/ci.py time python-format -- scripts/uvx.sh ruff@0.17.3 format --check .
      - run: python3 scripts/ci.py time ci-regressions -- python3 scripts/test-ci.py
      - run: python3 scripts/ci.py time packaging -- python3 scripts/test-packaging.py
      - name: Check Rust API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: python3 scripts/ci.py time rust-doc -- cargo doc --locked --profile ci --workspace --no-deps --document-private-items
      - run: python3 scripts/ci.py time --timeout 900 clippy -- cargo clippy --locked --profile ci --workspace --all-targets -- -D warnings
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-lint
          path: target/ci-results/
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build
      - name: Reset logs restored from the build cache
        run: rm -rf target/ci-results
      - uses: astral-sh/setup-uv@v7
      - run: python3 scripts/ci.py time dependencies -- bash scripts/ci-deps.sh build
      - name: Prepare pinned Ruff executable
        run: |
          scripts/uvx.sh --from ruff==0.17.3 python - <<'PY'
          from pathlib import Path
          import shutil
          destination = Path('target/test-tools/bin/ruff')
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(shutil.which('ruff'), destination)
          PY
          echo "RODE_TEST_RUFF=$PWD/target/test-tools/bin/ruff" >> "$GITHUB_ENV"
      - name: Build all tests and record their executable paths
        timeout-minutes: 20
        run: |
          python3 scripts/ci.py time --timeout 1200 test-build -- bash -c 'cargo test --locked --profile ci --workspace --all-targets --no-run --message-format=json > target/ci-test-binaries.json'
      - run: python3 scripts/ci.py time --timeout 600 rust-tests -- cargo test --locked --profile ci --workspace --all-targets
      - run: python3 scripts/ci.py time --timeout 600 editor-build -- cargo build --locked --profile ci --bins
      - run: python3 scripts/ci.py time --timeout 600 static-helper -- bash scripts/build-sessiond.sh
      - run: python3 scripts/ci.py bundle
      - uses: actions/upload-artifact@v7
        with:
          name: ci-binaries
          path: target/ci-bundle.tar.gz
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-build
          path: |
            target/ci-results/
            target/ci-test-binaries.json
          retention-days: 7

  fast-ui:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [workspace, agents, terminals, ssh]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-binaries
          path: target
      - run: tar -xzf target/ci-bundle.tar.gz
      - run: python3 scripts/ci.py time dependencies -- bash scripts/ci-deps.sh '${{ matrix.suite }}'
      - run: xvfb-run -a -s "$RODE_XVFB_SCREEN" python3 scripts/ci.py run '${{ matrix.suite }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-fast-${{ matrix.suite }}
          path: |
            target/ci-results/
            target/*-ui/
            target/ui-smoke/
            !target/ci-results/**/sessions/**
            !target/**/session-runtime/**
          retention-days: 7

  extended:
    needs: [plan, build]
    if: needs.plan.outputs.run-extended == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.extended) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-binaries
          path: target
      - run: tar -xzf target/ci-bundle.tar.gz
      - uses: astral-sh/setup-uv@v7
        if: contains(fromJSON('["documents","remote","runtimes"]'), matrix.suite)
      - run: python3 scripts/ci.py time dependencies -- bash scripts/ci-deps.sh '${{ matrix.suite }}'
      - name: Enable unprivileged namespaces on the disposable sandbox runner
        if: matrix.suite == 'sandbox'
        run: |
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: xvfb-run -a -s "$RODE_XVFB_SCREEN" python3 scripts/ci.py run '${{ matrix.suite }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-extended-${{ matrix.suite }}
          path: |
            target/ci-results/
            target/*-ui/
            target/ui-smoke/
            !target/ci-results/**/sessions/**
            !target/**/session-runtime/**
          retention-days: 7

  # Preserve the original required check name while extended checks report
  # separately, so ordinary feedback does not wait for every document viewer.
  linux:
    if: always()
    needs: [plan, lint, build, fast-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required checks failed or were skipped: ' + ', '.join(failed))
          PY

  release:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    uses: ./.github/workflows/package.yml
    with:
      maintainer: 'RODE CI <ci@example.invalid>'
      build_codex: false
