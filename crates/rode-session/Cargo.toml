[package]
name = "rode-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Native persistent PTY service for the RODE editor"
repository = "https://github.com/pbenner/rode"

[dependencies]
anyhow = "1"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.16"

[[bin]]
name = "rode-sessiond"
path = "src/main.rs"
