[package]
name = "rode-stocks"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Independent market-data extension for RODE's native panel API"

[dependencies]
rode-extension-api = { path = "../rode-extension-api", version = "0.1.0" }
anyhow = "1"
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[[bin]]
name = "rode-stocks"
path = "src/main.rs"
