[package]
name = "rode-host-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Headless host services shared by local and SSH RODE workspaces"

[dependencies]
rode-bwrap = { path = "../rode-bwrap" }
rode-runtime-core = { path = "../rode-runtime-core" }
portable-pty = "0.9"
rode-host-protocol = { path = "../rode-host-protocol" }
anyhow = "1"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

tempfile = "3"
