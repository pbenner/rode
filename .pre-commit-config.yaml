repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (uvx)
        entry: scripts/uvx.sh ruff@0.17.3 check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Ruff format (uvx)
        entry: scripts/uvx.sh ruff@0.17.3 format
        language: system
        types_or: [python, pyi]
        require_serial: true
